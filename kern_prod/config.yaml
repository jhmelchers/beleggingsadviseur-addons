# De Supervisor installeert image:version (ADR-009). Versie wordt door release.yml gezet; niet met de hand wijzigen.
name: Beleggingsadviseur kern
description: Kern-API van de beleggingsadviseur (productie)
slug: kern_prod
url: https://github.com/jhmelchers/beleggingsadviseur-addons
version: "0.1.19"
image: ghcr.io/jhmelchers/beleggingsadviseur-kern
arch: [aarch64]
startup: application
boot: auto
init: false
watchdog: http://[HOST]:[PORT:8080]/healthz
ports: {}          # geen hostpoort; alleen via cloudflared in het interne add-on-netwerk
environment:
  ROL: kern
options:
  access_team_domein: ""
  access_aud: ""
  toegang: []
schema:
  access_team_domein: url
  access_aud: str
  toegang:
    - email: email
      rol: list(beheerder|gebruiker)
  database_url: password?
  migratie_database_url: password?
